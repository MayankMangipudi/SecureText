<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureText - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="animated-gradient min-h-screen flex items-center justify-center">
    
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md fade-in" x-data="{ isLogin: true }">
        <!-- Logo/Title -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
                🔐 SecureText
            </h1>
            <p class="text-gray-500 mt-2">Encrypt, Decrypt, Secure</p>
        </div>

        <!-- Message Display -->
        <div id="message" class="hidden mb-4 p-3 rounded-lg text-center font-medium"></div>

        <!-- Login Form -->
        <div x-show="isLogin" x-transition.duration.300ms>
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Login</h2>
            <form id="loginForm" class="space-y-4" @submit.prevent="handleLogin">
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Username</label>
                    <input 
                        type="text" 
                        id="loginUsername" 
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition"
                        placeholder="Enter username"
                    >
                </div>
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Password</label>
                    <input 
                        type="password" 
                        id="loginPassword" 
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition"
                        placeholder="Enter password"
                    >
                </div>
                <button 
                    type="submit"
                    class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white font-bold py-3 rounded-lg hover:shadow-lg transform hover:scale-105 transition duration-200"
                >
                    Login
                </button>
            </form>
            <p class="text-center text-gray-600 mt-4">
                Don't have an account? 
                <button @click="isLogin = false" class="text-purple-600 font-semibold hover:underline">
                    Register
                </button>
            </p>
        </div>

        <!-- Register Form -->
        <div x-show="!isLogin" x-transition.duration.300ms>
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Register</h2>
            <form id="registerForm" class="space-y-4" @submit.prevent="handleRegister">
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Username</label>
                    <input 
                        type="text" 
                        id="registerUsername" 
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition"
                        placeholder="Choose username"
                    >
                </div>
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Password</label>
                    <input 
                        type="password" 
                        id="registerPassword" 
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition"
                        placeholder="Choose password"
                    >
                </div>
                <button 
                    type="submit"
                    class="w-full bg-gradient-to-r from-purple-500 to-pink-600 text-white font-bold py-3 rounded-lg hover:shadow-lg transform hover:scale-105 transition duration-200"
                >
                    Register
                </button>
            </form>
            <p class="text-center text-gray-600 mt-4">
                Already have an account? 
                <button @click="isLogin = true" class="text-purple-600 font-semibold hover:underline">
                    Login
                </button>
            </p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Check if already logged in
        checkAuth();

        async function handleLogin(e) {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            await login(username, password);
        }

        async function handleRegister(e) {
            const username = document.getElementById('registerUsername').value;
            const password = document.getElementById('registerPassword').value;
            const success = await register(username, password);
            if (success) {
                // Switch to login form after successful registration
                setTimeout(() => {
                    const loginForm = document.querySelector('[x-data]');
                    if (loginForm && loginForm.__x) {
                        loginForm.__x.$data.isLogin = true;
                    }
                }, 1500);
            }
        }
    </script>

    <style>
        .message.success {
            background-color: #10b981;
            color: white;
        }
        .message.error {
            background-color: #ef4444;
            color: white;
        }
    </style>
</body>
</html>
